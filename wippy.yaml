organization: chicago
module: appwiz
description: Add/Remove Programs for the Windows 95 shell (chicago/shell) — lists the application's wippy modules and edits its dependency declarations; the change takes effect after wippy update and a restart.
license: MIT
repository: https://github.com/chicago-desktop/appwiz
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - windows
# No `version:` here — the publisher picks it (`wippy publish` bumps the
# latest published one). A published version is immutable.
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
# `wippy publish` packs the entries of src/ and embeds only the fs.directory
# entries listed under `embed:`. The image pack lives outside src/ and is
# packed only when named here.
embed:
  - chicago.appwiz:images
